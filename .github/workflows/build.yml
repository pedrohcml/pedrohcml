name: Atualizar card do perfil

on:
  schedule:
    - cron: "0 6 * * *"   # todo dia, 06:00 UTC
  workflow_dispatch:
  push:
    paths: [build.py, ascii.txt]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar SVGs
        env:
          BIRTHDATE: ${{ secrets.BIRTHDATE }}   # AAAA-MM-DD, guardado como secret
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 build.py --user "${{ github.repository_owner }}"

      - name: Commit se mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark.svg light.svg
          git diff --cached --quiet || git commit -m "chore: atualiza card do perfil"
          git push
